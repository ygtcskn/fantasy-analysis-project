<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Written in Turkish and shown in the visitor's language, as index.html
       explains; only the title is in English, with its Turkish in data-tr. -->
  <title data-tr="Sayfa bulunamadı — Fantezi Analiz">Page not found — Fantezi Analiz</title>
  <!-- Cloudflare Pages answers a missing path with this page and a 404 status.
       Without it Pages treats the site as a single-page app and answers every
       missing data file with index.html, which the pages cannot tell apart
       from a CSV. It can be served at any depth, so links resolve from the root. -->
  <base href="/">
  <link rel="icon" href="assets/brand/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/theme-dark.css">
  <link rel="stylesheet" href="styles/page-header.css">
  <script src="core/english.js" defer></script>
  <script src="core/language.js" defer></script>
  <script src="core/site.js" defer></script>
  <script src="core/sidebar.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header" aria-labelledby="missing-title">
      <div class="topbar"><a class="team-link" href="index.html?view=home">← Ana Sayfa</a><span class="badge">FANTEZİ ANALİZ</span></div>
      <div class="page-heading">
        <div><p class="eyebrow">404</p><h1 id="missing-title">Sayfa bulunamadı</h1><p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir.</p></div>
      </div>
    </header>
  </main>
</body>
</html>
