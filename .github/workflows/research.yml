# Research reports: how well the models hold up. The site reads none of them;
# they are for checking the projections, radar and odds models (and for the
# showcase). Runs every Tuesday morning, after the weekend's matches, and on
# demand from the Actions tab. Each report goes to Cloudflare R2 under data/
# (src/sync_data.py) and is attached to the run for download.
name: Research reports

on:
  schedule:
    # Tuesday 06:00 UTC is 09:00 in Turkey, before the hourly updates start.
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      odds_backtest:
        description: "Also run the odds backtest over five finished seasons (slow; it only changes when the model changes)"
        type: boolean
        default: false

# Shares the update's lock, so the two never read and write R2 at the same time.
concurrency:
  group: update-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  SEASON: "2026/2027"
  ODDS_BACKTEST_SEASONS: "2021/2022 2022/2023 2023/2024 2024/2025 2025/2026"
  R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: fantezianaliz-data
  PYTHONUTF8: "1"

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/odds/requirements.txt

      # As in the update: the settings may come as one FANTEZI_ANALIZ_SECRET of
      # NAME=value lines. The file exists for this run only; nothing uploads it.
      - name: Write the settings secret
        env:
          SETTINGS: ${{ secrets.FANTEZI_ANALIZ_SECRET }}
        run: |
          if [ -n "$SETTINGS" ]; then
            printf '%s\n' "$SETTINGS" > .env
            echo "Settings written from FANTEZI_ANALIZ_SECRET."
          fi

      - name: Install the Python packages
        run: pip install --quiet -r src/odds/requirements.txt boto3

      - name: Fetch the published data from R2
        run: python src/sync_data.py pull

      # Each report stands alone: one that fails is shown on the run and the
      # rest still run and are saved.
      - name: Projection backtest (model against naive rules, by matchweek)
        continue-on-error: true
        run: python src/player_projections/backtest.py --season "$SEASON"

      - name: Radar reliability (how early a season's rates can be trusted)
        continue-on-error: true
        run: python -m src.spider.radar_reliability

      - name: XI opportunity cost (every player forced into the best XI)
        continue-on-error: true
        run: python src/xi_optimizer/sweep.py --season "$SEASON"

      - name: SQLite database (every CSV plus points and projections)
        continue-on-error: true
        run: python src/fetch/build_database.py --season "$SEASON" --include-fantasy

      - name: Odds backtest (on request)
        if: inputs.odds_backtest
        continue-on-error: true
        run: python src/odds/run.py backtest --seasons $ODDS_BACKTEST_SEASONS --gbdt xgboost

      - name: Save the reports to R2
        if: always()
        run: |
          python src/sync_data.py push \
            --path data/temp/player_projections/backtests \
            --path data/temp/radar_reliability.csv \
            --path data/temp/xi_optimizer --path data/final/xi_optimizer \
            --path data/temp/odds \
            --path data/superlig.sqlite

      - name: Attach the reports to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reports
          path: |
            data/temp/player_projections/backtests/
            data/temp/radar_reliability.csv
            data/temp/xi_optimizer/
            data/final/xi_optimizer/
            data/temp/odds/runs/
          if-no-files-found: warn
          retention-days: 30
